openapi: 3.0.3
info:
  title: Stockly API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /orders:
    post:
      summary: Criar pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Pedido criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Payload ou dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{id}:
    get:
      summary: Buscar pedido por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Item:
      type: object
      required: [sku, quantity, price_cents]
      properties:
        sku:
          type: string
          maxLength: 50
          example: SKU-001
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
          example: 2
        price_cents:
          type: integer
          format: int64
          minimum: 0
          example: 1000
    CreateOrderRequest:
      type: object
      required: [customer_id, items]
      properties:
        customer_id:
          type: string
          maxLength: 36
          example: cust-1
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/Item"
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
        status:
          type: string
          enum: [CREATED, COMPLETED, CANCELED]
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        total_cents:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error:
          type: string
